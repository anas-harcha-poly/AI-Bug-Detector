[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bug-detector"
description = "AI Python bug detection and code analysis tool"
readme = "README.md"
# Upper bound on purpose: Python 3.15+ has not been checked yet.
requires-python = ">=3.12,<3.15"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "ruff>=0.17",
    "streamlit>=1.67",
]

[project.optional-dependencies]
# fakeredis runs the real Lua budget scripts in tests, without any database.
dev = ["pytest>=9.2", "fakeredis[lua]>=2.40"]
# Only needed for real AI review: Ruff and the demo work without it.
ai = ["anthropic>=2.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_bug_detector.demo" = ["*.json", "*.txt"]

# Single source of truth: the version lives in the package itself.
[tool.setuptools.dynamic]
version = { attr = "ai_bug_detector.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that start real containers only run on request: pytest -m docker
addopts = ["-m", "not docker"]
markers = ["docker: starts real containers, needs Docker and the sandbox image"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
# E: style errors, F: likely bugs (pyflakes), I: import order, B: risky patterns (bugbear)
select = ["E", "F", "I", "B"]
